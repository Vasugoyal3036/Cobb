<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100%" height="100%" fill="none">
  <defs>
    <!-- Continuous Neon Gradient across O -> R -> S -->
    <linearGradient id="orsGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Specular Core Light (3D Glass Tube shine) -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neonGlow)">
    <!-- ================= LETTER O ================= -->
    <ellipse cx="22" cy="35" rx="15" ry="19" fill="none" stroke="#00f5ff" stroke-width="7" opacity="0.4" />
    <ellipse cx="22" cy="35" rx="15" ry="19" fill="none" stroke="url(#cyanRibbon)" stroke-width="5.5" />
    <ellipse cx="22" cy="35" rx="15" ry="19" fill="none" stroke="url(#specular)" stroke-width="1.4" stroke-dasharray="16 35" stroke-dashoffset="12" />

    <!-- ================= LETTER R ================= -->
    <path d="M 43 54 L 43 16 L 57 16 C 64.5 16 69.5 20 69.5 27 C 69.5 33.5 64.5 37.5 57 37.5 L 43 37.5 M 55.5 37.5 L 68 54"
          fill="none" stroke="#6366f1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    <path d="M 43 54 L 43 16 L 57 16 C 64.5 16 69.5 20 69.5 27 C 69.5 33.5 64.5 37.5 57 37.5 L 43 37.5 M 55.5 37.5 L 68 54"
          fill="none" stroke="url(#orsGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 43 53 L 43 17 L 57 17 C 63.5 17 68 20.5 68 27 C 68 32.5 63.5 36.5 57 36.5 L 43 36.5 M 56 37.5 L 67 53"
          fill="none" stroke="url(#specular)" stroke-width="1.3" stroke-linecap="round" />

    <!-- Connecting Fluid Flow Ribbon from R to S -->
    <path d="M 36 35 C 38 48 42 54 44 54" fill="none" stroke="url(#cyanRibbon)" stroke-width="2.5" opacity="0.6" />

    <!-- ================= LETTER S ================= -->
    <path d="M 91 22.5 C 88 18 82.5 15.5 76 15.5 C 68 15.5 63 20.5 63 26.5 C 63 34 71 37 78.5 40 C 86 43 90 46.5 90 53 C 90 60 84 64.5 75 64.5 C 67 64.5 61.5 60.5 59 55"
          fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    <path d="M 91 22.5 C 88 18 82.5 15.5 76 15.5 C 68 15.5 63 20.5 63 26.5 C 63 34 71 37 78.5 40 C 86 43 90 46.5 90 53 C 90 60 84 64.5 75 64.5 C 67 64.5 61.5 60.5 59 55"
          fill="none" stroke="url(#purpleRibbon)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 90 23 C 87.5 19 82.5 17 76 17 C 69 17 64.5 21 64.5 26.5 C 64.5 33 71.5 36 78.5 39 C 85.5 42 88.5 45.5 88.5 53 C 88.5 58.5 83.5 63 75 63 C 68 63 63 59.5 60.5 55"
          fill="none" stroke="url(#specular)" stroke-width="1.3" stroke-linecap="round" />

    <!-- Sparks -->
    <circle cx="57" cy="27" r="1.5" fill="#ffffff" />
    <circle cx="57" cy="27" r="3.5" fill="#00f5ff" opacity="0.6" />
    <circle cx="76" cy="15.5" r="1" fill="#ffffff" />
    <circle cx="76" cy="15.5" r="2.5" fill="#ec4899" opacity="0.5" />
  </g>
</svg>
