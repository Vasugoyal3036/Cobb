<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ors-logo.png" />
    <link rel="apple-touch-icon" href="/ors-logo.png" />
    <script>
      (function() {
        // Resolve root base for SPA deep routing when running over HTTP/HTTPS
        if (window.location.protocol.startsWith('http')) {
          var baseTag = document.createElement('base');
          baseTag.href = '/';
          document.head.appendChild(baseTag);
        }

        var isStock = window.location.pathname.includes('/stock') ||
                      window.location.pathname.includes('/checker') ||
                      window.location.search.includes('stock') ||
                      window.location.search.includes('checker') ||
                      window.location.hash.includes('stock') ||
                      window.location.hash.includes('checker');

        // Dynamically provide dedicated PWA manifest for Staff Stock Checker vs POS CRM
        var manifestHref = isStock ? '/manifest-stock.json' : '/manifest.json';
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.id = 'app-manifest-link';
        link.href = manifestHref;
        document.head.appendChild(link);

        if (isStock) {
          document.title = 'Cobb Stock Checker | Floor Staff';
        }
      })();
    </script>
    <noscript>
      <link rel="manifest" href="/manifest.json" />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1017" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cobb CRM" />
    <meta name="application-name" content="Cobb CRM" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet" />
    <title>Cobb Store CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
      if (window.location.search.includes("reset")) {
        localStorage.clear();
        indexedDB.databases().then(dbs => dbs.forEach(db => indexedDB.deleteDatabase(db.name)));
      }
    </script>
  </body>
</html>
